# To comply with FIPS 140-2, we should not use crypto algorithms implemented in
# rust, instead we should delegate these operation to OpenSSL, including
# symmetric encryption, asymmetric encryption, hash functions,
# key establishment, digital signatures and random number generators.
[bans]
deny = [
    # Hash functions
    # We allow md5 for AWS S3 object lock feature which requires
    # computting object's md5.
    { name = "md5", wrappers = ["aws", "google-cloud-storage"] },
    { name = "md-5", wrappers = ["aws-smithy-checksums"]},
    # time 0.2 pulls sha1 through stdweb's proc-macro on wasm-only targets.
    { name = "sha1", wrappers = ["aws-smithy-checksums", "stdweb-internal-macros"]},
    { name = "sha-1" },
    { name = "sha2", wrappers = ["oauth2", "aws-sigv4", "aws-smithy-checksums", "aws-sdk-s3", "google-cloud-storage"] },
    { name = "sha3" },
    # Symmetric encryption
    { name = "aes" },
    { name = "aes-gcm" },
    { name = "aes-gcm-siv" },
    { name = "chacha20poly1305" },
    # google-cloud-gax pulls rand 0.10, which currently reaches chacha20.
    { name = "chacha20", wrappers = ["rand"] },
    # Asymmetric encryption
    { name = "elliptic-curves" },
    { name = "rsa" },
    # Digital signatures
    { name = "dsa" },
    { name = "ecdsa" },
    { name = "ed25519" },
    # Message authentication codes
    { name = "hmac", wrappers = ["aws-sigv4", "aws-sdk-s3"]},
    # We prefer the system native TLS or OpenSSL.
    # gcp_v2 enables rustls only to install and require the aws-lc-rs FIPS provider at runtime.
    { name = "rustls", wrappers = ["gcp_v2", "google-cloud-auth", "reqwest", "tokio-rustls", "hyper-rustls"] },
    { name = "ring", wrappers = ["rustls", "rustls-webpki"] },
    # Ban trait crates from RustCrypto.
    { name = "aead" },
    { name = "cipher" },
    # aws-smithy-checksums reaches digest through crc-fast in newer releases.
    { name = "digest", wrappers = ["sha2", "md-5", "sha1", "hmac", "crc-fast"] },
    { name = "password-hash" },
    { name = "signature" },
    # Advisory exceptions apply by ID rather than package version. Restrict
    # the unpatched h2 0.3 line to its known direct consumers, and reject all
    # other versions affected by RUSTSEC-2026-0258.
    { crate = "h2:<0.3", reason = "not part of the temporary h2 0.3 exception" },
    { crate = "h2:>=0.3,<0.4", wrappers = ["aws-smithy-http-client", "hyper", "reqwest"], reason = "only the existing h2 0.3 dependency chains are temporarily accepted" },
    { crate = "h2:>=0.4,<0.4.16", reason = "upgrade h2 0.4 to at least 0.4.16" },
    # Only the currently reviewed azure_core 0.18.0 release is covered by the
    # temporary RUSTSEC-2026-0275 exception below.
    { crate = "azure_core:<0.18.0", reason = "not part of the temporary azure_core 0.18.0 exception" },
    { crate = "azure_core:>0.18.0,<0.22.0", reason = "upgrade to a patched azure_core release" },
]
multiple-versions = "allow"

[advisories]
version = 2
yanked = "deny"
unmaintained = 'workspace'
ignore = [
    # Ignore RUSTSEC-2021-0145 (unsound issue of "atty" crate) as it only
    # affects Windows plaform which is not supported offically by TiKV, and 2)
    # we have disabled the clap feature "color" so that the "atty" crate is not
    # included in production code.
    #
    # TODO: Upgrade clap to v4.x.
    "RUSTSEC-2021-0145",
    # Ignore RUSTSEC-2024-0436, as there is no widely used replacement of 
    # package 'paste', and the package itself is very stable.
    "RUSTSEC-2024-0436",
    # Ignore RUSTSEC-2025-0057 temporarily. We are evaluating alternatives to
    # replace FxHash. Currently, this package is stable and there are no known
    # exploitable vulnerabilities affecting our use case.
    "RUSTSEC-2025-0057",
    # Ignore RUSTSEC-2026-0097 (unsound issue in rand with a custom logger using
    # rand::rng()). The vulnerability requires a custom logger that calls
    # rand::rng() / thread_rng() during logging, which TiKV does not do.
    # TODO: Upgrade rand to >=0.9.3 or >=0.10.1 when possible.
    "RUSTSEC-2026-0097",
    # Ignore RUSTSEC-2026-0174, as it does not introduce safety issues, only
    # violating ASCII invariants. Meanwhile, it only affects the `azure` crate,
    # which can be upgraded after it fixes the issue.
    #
    # See: https://github.com/http-rs/http-types/issues/534
    "RUSTSEC-2026-0174",
    # Ignore RUSTSEC-2026-0194 and RUSTSEC-2026-0195 temporarily. Both come
    # from quick-xml through two transitive chains:
    #   1. pprof -> inferno -> quick-xml, which TiKV uses only to generate
    #      local flamegraph SVG output rather than parse untrusted XML input.
    #   2. azure_core 0.18 -> quick-xml, which requires an Azure SDK upgrade
    #      instead of a lockfile-only update to reach quick-xml >= 0.41.
    # The remaining practical exposure is limited to XML returned by the
    # configured Azure endpoint over TLS, so we accept the temporary DoS risk
    # until we schedule the SDK upgrade and pprof/inferno dependency refresh.
    # TODO: Remove after both dependency chains can move to quick-xml >= 0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # Ignore RUSTSEC-2026-0253 for now: Cargo.lock shows `lru` 0.16.3 is pulled
    # in only via `aws-sdk-s3`. The advisory is only relevant when unwinding
    # panics are enabled and `std::panic::catch_unwind` is used with key types
    # that may panic in `Drop`.
    # 
    # See: https://rustsec.org/advisories/RUSTSEC-2026-0253
    "RUSTSEC-2026-0253",
    # Ignore RUSTSEC-2026-0258 for the legacy h2 0.3 dependency chains only.
    # Cargo.lock upgrades h2 0.4 to the patched 0.4.16 release, but hyper 0.14,
    # reqwest 0.11, and aws-smithy-http-client still require h2 0.3, for which
    # upstream has not released a patch. Exploitation requires a malicious
    # direct HTTP/2 peer and an incoming body that is not fully drained.
    #
    # TODO: Remove after the legacy clients move off h2 0.3.
    "RUSTSEC-2026-0258",
    # Ignore RUSTSEC-2026-0275 temporarily while TiKV still uses the legacy Azure
    # SDK. azure_core 0.18 can log live Authorization headers at Debug/Trace
    # level. TiKV's logger blocks those records before they reach its log drains,
    # including after an online log level change.
    #
    # TODO: Remove after the SDK is upgraded or patched, or another fix supersedes
    # the temporary credential-log filter in TiKV.
    "RUSTSEC-2026-0275",
]

# TiKV is licensed under Apache 2.0, according to ASF 3RD PARTY LICENSE POLICY,
# TiKV can include licenses in Category A, and include licenses in Category B
# under certain conditions.
# See https://www.apache.org/legal/resolved.html.
[licenses]
version = 2
private = { ignore = false }
# Allow licenses in Category A
allow = ["0BSD", "Apache-2.0", "BSD-3-Clause", "CC0-1.0", "ISC", "MIT", "Zlib", "Unicode-3.0"]
exceptions = [
    # unicode-ident includes data generated from Unicode Character Database
    # which is licensed under Unicode-DFS-2016.
    # See https://github.com/dtolnay/unicode-ident/pull/4
    { name = "unicode-ident", allow = ["Unicode-DFS-2016"] },
    # Allow licenses in Category B explicitly, make their usage more prominent.
    { name = "slog-json", allow = ["MPL-2.0"] },
    { name = "smartstring", allow = ["MPL-2.0"] },
    { name = "inferno", allow = ["CDDL-1.0"] },
    # rustls FIPS support pulls aws-lc-fips-sys, which is dual/triple licensed and
    # includes the OpenSSL license in its SPDX expression.
    { name = "aws-lc-fips-sys", allow = ["OpenSSL"] },
    # reqwest/hyper-rustls bundle Mozilla root certificates through webpki-roots.
    { name = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-org = { github = ["tikv", "pingcap", "rust-lang"] }
