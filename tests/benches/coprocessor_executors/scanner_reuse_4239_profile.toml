# Local verification profile, merged in the original Cargo configuration order.
# Includes shipping profile.test defaults, both local configs, and inline CLI overrides.
# This file does not modify the shipping workspace profiles.
# Native RocksDB is independently built by CMake in Release mode.

[profile.test]
codegen-units = 16
debug = 0
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
rpath = false

[profile.test.package.aws-sdk-s3]
codegen-units = 1

[profile.test.package.engine_rocks]
