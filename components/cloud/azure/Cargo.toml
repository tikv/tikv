[package]
name = "azure"
version = "0.0.1"
edition = "2021"
publish = false
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
azure_core = { version = "1.1", default-features = false, features = ["hmac_openssl", "reqwest", "tokio"] }
azure_identity = { version = "1.0", default-features = false, features = ["tokio"] }
azure_security_keyvault_keys = { version = "1.0.1", default-features = false }
azure_storage_blob = { version = "1.1", default-features = false, features = ["tokio"] }
base64 = "0.13"
cloud = { workspace = true }
# The supported Blob SDK uses Receiver::recv, introduced in futures 0.3.32.
futures = "0.3.32"
futures-util = { version = "0.3", default-features = false, features = ["io"] }
kvproto = { workspace = true }
openssl = { workspace = true }
# Keep the Azure SDK's reqwest transport on the native OpenSSL TLS backend.
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slog = { workspace = true }
slog-global = { workspace = true }
tikv_util = { workspace = true }
time = { version = "0.3", features = ["local-offset", "formatting", "macros"] }
tokio = { version = "1.5", features = ["time"] }
url = "2.0"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.5", features = ["test-util"] }
